name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libreadline-dev

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build . -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: skynet-cmake-linux-x64
        path: |
          build/skynet
          build/luaclib/
          build/cservice/
          build/lualib/
          build/service/
          build/examples/

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build . -j$(sysctl -n hw.ncpu)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: skynet-cmake-macos-x64
        path: |
          build/skynet
          build/luaclib/
          build/cservice/
          build/lualib/
          build/service/
          build/examples/

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [debug, release]
        include:
          - config: debug
            preset: x64-debug
            build_dir: out/build/x64-debug
          - config: release
            preset: x64-release
            build_dir: out/build/x64-release
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure build PATH
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake --preset ${{ matrix.preset }}

    - name: Build
      run: |
        cmake --build ${{ matrix.build_dir }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: skynet-cmake-windows-x64-${{ matrix.config }}
        path: |
          ${{ matrix.build_dir }}/skynet.exe
          ${{ matrix.build_dir }}/lua.exe
          ${{ matrix.build_dir }}/luac.exe
          ${{ matrix.build_dir }}/*.dll
          ${{ matrix.build_dir }}/luaclib/
          ${{ matrix.build_dir }}/cservice/
          ${{ matrix.build_dir }}/lualib/
          ${{ matrix.build_dir }}/service/
          ${{ matrix.build_dir }}/examples/
