name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: skynet-cmake-linux-x64
            build_dir: build
            executable: skynet
          - os: macos-latest
            artifact_name: skynet-cmake-macos-x64
            build_dir: build
            executable: skynet
          - os: windows-latest
            config: debug
            artifact_name: skynet-cmake-windows-x64-debug
            preset: x64-debug
            build_dir: out/build/x64-debug
            executable: skynet.exe
          - os: windows-latest
            config: release
            artifact_name: skynet-cmake-windows-x64-release
            preset: x64-release
            build_dir: out/build/x64-release
            executable: skynet.exe
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libreadline-dev

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake

    - name: Configure build PATH (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cmake --preset ${{ matrix.preset }}

    - name: Build (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd build
        cmake --build . -j

    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cmake --build ${{ matrix.build_dir }}

    - name: Package artifacts (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd "${{ matrix.build_dir }}"
        # Create list of files and directories that exist
        items=""
        [ -f "${{ matrix.executable }}" ] && items="$items ${{ matrix.executable }}"
        [ -d "luaclib" ] && items="$items luaclib"
        [ -d "cservice" ] && items="$items cservice"
        [ -d "lualib" ] && items="$items lualib"
        [ -d "service" ] && items="$items service"
        [ -d "examples" ] && items="$items examples"
        tar -czf "$GITHUB_WORKSPACE/${{ matrix.artifact_name }}.tar.gz" $items

    - name: Package artifacts (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd "${{ matrix.build_dir }}"
        # Collect files that exist
        $files = @()
        $files += Get-Item -Path "${{ matrix.executable }}" -ErrorAction SilentlyContinue
        $files += Get-Item -Path "lua.exe" -ErrorAction SilentlyContinue
        $files += Get-Item -Path "luac.exe" -ErrorAction SilentlyContinue
        $files += Get-Item -Path "*.dll" -ErrorAction SilentlyContinue
        $dirs = @("luaclib", "cservice", "lualib", "service", "examples")
        foreach ($dir in $dirs) {
          if (Test-Path $dir) {
            $files += Get-Item -Path $dir
          }
        }
        if ($files.Count -gt 0) {
          Compress-Archive -Path $files -DestinationPath "$env:GITHUB_WORKSPACE/${{ matrix.artifact_name }}.zip" -Force
        }
      shell: pwsh

    - name: Upload Release Assets (Linux/macOS)
      if: matrix.os != 'windows-latest'
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.artifact_name }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Assets (Windows)
      if: matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.artifact_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
