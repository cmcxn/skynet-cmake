# Workflow's name
name: msvc

# Run this workflow every time a new commit pushed to your repository
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name:  Configure build PATH
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake --preset x64-debug

    - name: Build
      run: cmake --build out/build/x64-debug
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: skynet-cmake-windows-x64
        path: |
          out/build/x64-debug/skynet.exe
          out/build/x64-debug/*.dll
          out/build/x64-debug/luaclib/
          out/build/x64-debug/cservice/
          out/build/x64-debug/lualib/
          out/build/x64-debug/service/
          out/build/x64-debug/examples/
