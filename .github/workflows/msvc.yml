# Workflow's name
name: msvc

# Run this workflow every time a new commit pushed to your repository
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [debug, release]
        include:
          - config: debug
            preset: x64-debug
            build_dir: out/build/x64-debug
          - config: release
            preset: x64-release
            build_dir: out/build/x64-release
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name:  Configure build PATH
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build ${{ matrix.build_dir }}
    
    - name: Copy Visual C++ Runtime DLLs
      run: |
        # Copy MSVC runtime DLLs to build directory
        $buildDir = "${{ matrix.build_dir }}"
        $config = "${{ matrix.config }}"
        
        Write-Host "Build directory: $buildDir"
        Write-Host "Configuration: $config"
        
        # Find vcruntime DLLs
        if ($config -eq "debug") {
          Write-Host "Searching for debug runtime DLLs..."
          
          # Debug runtime DLLs from VC Tools
          $vcRuntime = Get-ChildItem -Path "$env:VCToolsInstallDir\bin" -Recurse -Filter "vcruntime140d.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" -and $_.FullName -notmatch "onecore" } | Select-Object -First 1
          $msvcp = Get-ChildItem -Path "$env:VCToolsInstallDir\bin" -Recurse -Filter "msvcp140d.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" -and $_.FullName -notmatch "onecore" } | Select-Object -First 1
          $concrt = Get-ChildItem -Path "$env:VCToolsInstallDir\bin" -Recurse -Filter "concrt140d.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" -and $_.FullName -notmatch "onecore" } | Select-Object -First 1
          $vccorlib = Get-ChildItem -Path "$env:VCToolsInstallDir\bin" -Recurse -Filter "vccorlib140d.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" -and $_.FullName -notmatch "onecore" } | Select-Object -First 1
          
          # Copy all UCRT debug DLLs from Windows SDK
          $ucrtDebugDir = "$env:UniversalCRTSdkDir\bin\$env:UCRTVersion\x64\ucrt"
          Write-Host "UCRT Debug directory: $ucrtDebugDir"
          
          if (Test-Path $ucrtDebugDir) {
            # Copy all debug UCRT DLLs
            $ucrtDlls = Get-ChildItem -Path $ucrtDebugDir -Filter "*d.dll" -ErrorAction SilentlyContinue
            foreach ($dll in $ucrtDlls) {
              Copy-Item $dll.FullName -Destination $buildDir -Force
              Write-Host "Copied UCRT: $($dll.Name)"
            }
          } else {
            Write-Host "Warning: UCRT debug directory not found"
          }
        } else {
          Write-Host "Searching for release runtime DLLs..."
          
          # Release runtime DLLs
          $vcRuntime = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "vcruntime140.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" -and $_.FullName -notmatch "onecore" } | Select-Object -First 1
          $msvcp = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" -and $_.FullName -notmatch "onecore" } | Select-Object -First 1
          $concrt = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "concrt140.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" -and $_.FullName -notmatch "onecore" } | Select-Object -First 1
          $vccorlib = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "vccorlib140.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" -and $_.FullName -notmatch "onecore" } | Select-Object -First 1
        }
        
        # Copy the DLLs
        if ($vcRuntime) {
          Copy-Item $vcRuntime.FullName -Destination $buildDir -Force
          Write-Host "Copied: $($vcRuntime.Name) from $($vcRuntime.DirectoryName)"
        } else {
          Write-Host "Warning: vcruntime not found"
        }
        
        if ($msvcp) {
          Copy-Item $msvcp.FullName -Destination $buildDir -Force
          Write-Host "Copied: $($msvcp.Name) from $($msvcp.DirectoryName)"
        } else {
          Write-Host "Warning: msvcp not found"
        }
        
        if ($concrt) {
          Copy-Item $concrt.FullName -Destination $buildDir -Force
          Write-Host "Copied: $($concrt.Name)"
        }
        
        if ($vccorlib) {
          Copy-Item $vccorlib.FullName -Destination $buildDir -Force
          Write-Host "Copied: $($vccorlib.Name)"
        }
        
        Write-Host "Runtime DLLs copied to build directory"
        Write-Host "Contents of build directory:"
        Get-ChildItem -Path $buildDir -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
      shell: pwsh
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: skynet-cmake-windows-x64-${{ matrix.config }}
        path: |
          ${{ matrix.build_dir }}/skynet.exe
          ${{ matrix.build_dir }}/lua.exe
          ${{ matrix.build_dir }}/luac.exe
          ${{ matrix.build_dir }}/*.dll
          ${{ matrix.build_dir }}/luaclib/
          ${{ matrix.build_dir }}/cservice/
          ${{ matrix.build_dir }}/lualib/
          ${{ matrix.build_dir }}/service/
          ${{ matrix.build_dir }}/examples/
