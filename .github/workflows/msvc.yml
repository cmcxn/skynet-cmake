# Workflow's name
name: msvc

# Run this workflow every time a new commit pushed to your repository
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [debug, release]
        include:
          - config: debug
            preset: x64-debug
            build_dir: out/build/x64-debug
          - config: release
            preset: x64-release
            build_dir: out/build/x64-release
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name:  Configure build PATH
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build ${{ matrix.build_dir }}
    
    - name: Copy Visual C++ Runtime DLLs
      run: |
        # Copy MSVC runtime DLLs to build directory
        $buildDir = "${{ matrix.build_dir }}"
        $config = "${{ matrix.config }}"
        
        # Find vcruntime DLLs
        if ($config -eq "debug") {
          # Debug runtime DLLs
          $vcRuntime = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "vcruntime140d.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          $ucrtBase = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "ucrtbased.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msvcp = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "msvcp140d.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          
          # If not in redist, try debug directory
          if (-not $vcRuntime) {
            $vcRuntime = Get-ChildItem -Path "$env:VCToolsInstallDir\bin" -Recurse -Filter "vcruntime140d.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          }
          if (-not $msvcp) {
            $msvcp = Get-ChildItem -Path "$env:VCToolsInstallDir\bin" -Recurse -Filter "msvcp140d.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          }
          
          # Copy debug UCRT from Windows SDK
          $sdkDir = "$env:UniversalCRTSdkDir\bin\$env:UCRTVersion\x64\ucrt"
          if (Test-Path "$sdkDir\ucrtbased.dll") {
            Copy-Item "$sdkDir\ucrtbased.dll" -Destination $buildDir -Force
            Write-Host "Copied ucrtbased.dll"
          }
        } else {
          # Release runtime DLLs
          $vcRuntime = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "vcruntime140.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          $msvcp = Get-ChildItem -Path "$env:VCToolsRedistDir" -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
        }
        
        # Copy the DLLs
        if ($vcRuntime) {
          Copy-Item $vcRuntime.FullName -Destination $buildDir -Force
          Write-Host "Copied $($vcRuntime.Name)"
        }
        if ($msvcp) {
          Copy-Item $msvcp.FullName -Destination $buildDir -Force
          Write-Host "Copied $($msvcp.Name)"
        }
        
        Write-Host "Runtime DLLs copied to build directory"
      shell: pwsh
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: skynet-cmake-windows-x64-${{ matrix.config }}
        path: |
          ${{ matrix.build_dir }}/skynet.exe
          ${{ matrix.build_dir }}/lua.exe
          ${{ matrix.build_dir }}/luac.exe
          ${{ matrix.build_dir }}/*.dll
          ${{ matrix.build_dir }}/luaclib/
          ${{ matrix.build_dir }}/cservice/
          ${{ matrix.build_dir }}/lualib/
          ${{ matrix.build_dir }}/service/
          ${{ matrix.build_dir }}/examples/
